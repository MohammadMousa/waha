server {
    listen 80;
    server_name waha1.duckdns.org;

    # Let's Encrypt challenge validation path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name waha1.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/waha1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waha1.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve your admin dashboard static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

  location = /config.json {
      add_header Cache-Control "no-store";
  }

    # Route API calls to your Java backend container
    location /api/ {
        proxy_pass http://waha:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
