services:
  admin-web:
    image: nginx:alpine
    container_name: waha_admin_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
   volumes:
      - ./admin_build/web:/usr/share/nginx/html:ro      # Keeps your dashboard UI files
      - ./nginx/conf.d:/etc/nginx/conf.d                # New directory for SSL configs
      - ./certbot/conf:/etc/letsencrypt                 # SSL certificates storage
      - ./certbot/www:/var/www/certbot                  # Let's Encrypt validation webroot
    depends_on:
      - waha
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
