server {
    listen 80;

    # nginx defaults to 1 MB; the backend accepts uploads up to 10 MB (kiosk log bundles, images).
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://waha:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resource/ {
        proxy_pass http://waha:8080/resource/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
