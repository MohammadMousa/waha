version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      # Only applies when the database is first created. To change it on an existing database, change it in MySQL first (see docs/deployment.md).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: waha
    command: --innodb-buffer-pool-size=384M
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # DB_PORT_BIND=127.0.0.1 keeps the database reachable from the server itself only. Unset = all interfaces, as before.
      - "${DB_PORT_BIND:+${DB_PORT_BIND:-}:}3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  waha:
    container_name: waha
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped   # also self-heals from the MySQL-not-quite-ready race on first boot
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      JAVA_TOOL_OPTIONS: "-Xmx512m"   # keeps the JVM from growing into the database's share of a small server
      # Pulled from a real .env file (not .env.example2) sitting next to
      # this docker-compose.yml - Compose substitutes ${VAR} from .env
      # automatically, no extra flag needed. Empty string if unset, not an
      # error - matches application.yml's own empty defaults.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MYFATOORAH_API_KEY: ${MYFATOORAH_API_KEY:-}
      MYFATOORAH_BASE_URL: ${MYFATOORAH_BASE_URL:-https://apitest.myfatoorah.com}
      MYFATOORAH_WEBHOOK_SECRET: ${MYFATOORAH_WEBHOOK_SECRET:-}
      WAHA_PUBLIC_BASE_URL: ${WAHA_PUBLIC_BASE_URL:-http://localhost:8081}
      # Test setups only: allows the fake "simulated" payment. Leave unset on a server with real sales.
      WAHA_SIMULATED_PAYMENT_ENABLED: ${WAHA_SIMULATED_PAYMENT_ENABLED:-false}
      # Encrypts saved secrets (the Odoo API key). Generate once with: openssl rand -base64 32
      WAHA_SECRET_KEY: ${WAHA_SECRET_KEY:-}
    ports:
      # WAHA_PORT_BIND=127.0.0.1 closes direct access to the backend from outside (nginx on 443 stays the public entry). Unset = all interfaces.
      - "${WAHA_PORT_BIND:+${WAHA_PORT_BIND:-}:}8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Admin dashboard + HTTPS entry (nginx). Off by default; the server turns it on with COMPOSE_PROFILES=web in .env,
  # so deploys, reboots and "docker compose up -d" bring it up together with the backend on the same network.
  admin-web:
    profiles: ["web"]
    image: nginx:alpine
    container_name: waha_admin_web
    restart: unless-stopped
    depends_on:
      - waha
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./admin_build/web:/usr/share/nginx/html:ro
      - ${NGINX_CONF_DIR:-./nginx/conf.d}:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
